name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx python-multipart Pillow pymupdf

      - name: Unit / integration tests (no full retrain)
        env:
          API_KEY: ci-test-key
        run: |
          pytest tests/ -q --tb=short \
            --ignore=tests/test_end_to_end.py \
            --ignore=tests/test_regression.py

      - name: Reviewer check (artifact-backed)
        env:
          API_KEY: ci-test-key
        run: |
          if [ -f outputs/forecasts/evaluation_metrics.csv ] && [ -f champion_registry.json ]; then
            python reviewer_check.py
          else
            echo "Skipping reviewer_check.py — trained artifacts not in checkout"
          fi

      - name: Validate outputs schema (if present)
        run: |
          if [ -f outputs/forecasts/evaluation_metrics.csv ]; then
            python validate_outputs.py
          else
            echo "Skipping validate_outputs.py — artifacts not in checkout"
          fi
